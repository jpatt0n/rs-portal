name: Deploy to FTP

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Locate receiver release
        id: receiver
        run: |
          node --input-type=module -e "import { readdirSync, appendFileSync } from 'node:fs'; const versions = readdirSync('dist/rs/releases'); if (versions.length !== 1 || !/^[a-f0-9]{16}$/.test(versions[0])) throw new Error('Expected one receiver release'); appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + versions[0] + '\n');"

      # Each release owns its FTP state, so deploying the next version does not
      # delete receiver modules still in use by an open browser session.
      - name: Deploy receiver release first
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          local-dir: dist/rs/releases/${{ steps.receiver.outputs.version }}/
          server-dir: ${{ secrets.FTP_DEST }}rs/releases/${{ steps.receiver.outputs.version }}/

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          local-dir: dist/
          server-dir: ${{ secrets.FTP_DEST }}
          exclude: |
            **/.git*
            **/node_modules/**
            **/src/**
            **/public/assets/.DS_Store
            rs/releases/**
